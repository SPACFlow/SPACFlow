<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d4ed8">
  <title>SpacFlow · Gestão de demandas da VISAT</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <section class="tela-login" id="telaLogin" hidden></section>

  <div class="app" id="app" hidden>
    <aside class="sidebar">
      <div class="marca">
        <div class="logo">SPAC</div>
        <div><strong>SpacFlow</strong><small>VISAT</small></div>
      </div>
      <nav id="menu" aria-label="Telas do sistema">
        <a class="nav-item" href="#painel" data-tela="painel">Painel de Demandas</a>
        <a class="nav-item" href="#sei" data-tela="sei">Integração SEI</a>
        <a class="nav-item" href="#relatorios" data-tela="relatorios">Relatórios</a>
        <a class="nav-item" href="#configuracoes" data-tela="configuracoes">Configurações</a>
      </nav>
      <div class="usuario-logado" id="usuarioLogado"></div>
    </aside>

    <main>
      <header class="topo">
        <div>
          <h1 id="tituloTela">Painel de Demandas</h1>
          <p id="subtituloTela">Acompanhamento centralizado das demandas da VISAT.</p>
        </div>
        <button class="btn primario" id="btnNova">+ Nova demanda</button>
      </header>

      <div data-tela="painel">
        <section class="indicadores" id="indicadores"></section>
        <section class="filtros" id="filtros"></section>
        <section class="quadro" id="quadro"></section>
      </div>
      <div data-tela="sei" id="telaSei" hidden></div>
      <div data-tela="relatorios" id="telaRelatorios" hidden></div>
      <div data-tela="configuracoes" id="telaConfiguracoes" hidden></div>
    </main>
  </div>

  <div class="aviso" id="aviso" role="status" aria-live="polite"></div>
  <script type="module" src="main.js"></script>
</body>
</html>
