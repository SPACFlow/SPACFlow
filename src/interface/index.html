<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpaceFlow · Painel de Demandas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

      <div><strong>epacflow</strong><small>VISAT</small></div>
    </div>
    <nav>
      <a class="ativo" href="#">Painel de Demandas</a>
      <a class="desativado" title="Em breve">Integração SEI</a>

    </nav>

  <div class="aviso" id="aviso" role="status"></div>
  <script type="module" src="main.js"></script>
